<!DOCTYPE html>
<html>
	<head>
		<meta
			http-equiv="Cache-control"
			content="no-cache, no-store, must-revalidate"
		/>
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="expires" content="0" />
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com https://ui5.sap.com https://sapui5.hana.ondemand.com 'unsafe-eval' 'unsafe-inline'; media-src *; img-src * data:; connect-src *;">

		<title>LovApp - Controller</title>

		<!-- Cordova Script - wird automatisch eingefügt wenn als Cordova-App läuft -->
		<script src="cordova.js"></script>

		<script
			id="sap-ui-bootstrap"
			src="resources/sap-ui-core.js"
			data-sap-ui-resourceroots='{
				"de.plexdev.lovapp": "./"
			}'
			data-sap-ui-theme="sap_horizon_dark"
			data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
			data-sap-ui-async="true"
			data-sap-ui-compatVersion="edge"
			data-sap-ui-frameOptions="trusted"
			data-sap-ui-xx-waitForTheme="true"
			data-sap-ui-xx-supportedLanguages="en,de"
		></script>

		<script>
			// Cordova deviceready Handler
			document.addEventListener('deviceready', function() {
				console.log('Cordova is ready!');
				
				// Verstecke Splashscreen
				if (navigator.splashscreen) {
					navigator.splashscreen.hide();
				}
				
				// Setze Statusbar-Farbe (falls Plugin vorhanden)
				if (window.StatusBar) {
					StatusBar.backgroundColorByHexString('#1d232a');
					StatusBar.styleLightContent();
				}
				
				// Trigger Custom Event für die App
				var event = new CustomEvent('cordova-deviceready');
				document.dispatchEvent(event);
			}, false);
		</script>
	</head>

	<body class="sapUiBody">
		<div data-sap-ui-component data-name="de.plexdev.lovapp"></div>
	</body>
</html>
